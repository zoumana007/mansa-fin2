services:
  postgres-pilot:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mansa_pilot
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mansa_pilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
